<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Pippotecno</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<main>
<div id="msg"></div>
<section class="box" id="login">
  <h2>Ingresar</h2>
  <div class="fld"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
  <div class="fld"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
  <button class="btn" id="entrar">Entrar</button>
</section>
<div id="panel" class="hide">
  <div class="row"><h2 style="margin:0">Panel Pippotecno</h2><button class="btn sec" id="salir" style="flex:0">Cerrar sesión</button></div>
  <div class="tabs"><button class="chip on" data-t="t1">Productos</button><button class="chip" data-t="t2">Categorías</button><button class="chip" data-t="t3">Negocio</button></div>

  <div id="t1" class="tab">
    <section class="box"><h3 id="ftit">Nuevo producto</h3>
      <div class="fld"><label>Nombre</label><input id="pn"></div>
      <div class="row"><div><label>Precio</label><input id="pp" type="number" min="0"></div><div><label>Stock</label><input id="ps" type="number" min="0"></div></div>
      <div class="row"><div><label>Categoría</label><select id="pc"></select></div>
      <div><label>Etiqueta</label><select id="pe"><option value="ninguna">Ninguna</option><option>Oferta</option><option>Nuevo</option><option>Destacado</option></select></div></div>
      <div class="fld"><label>Foto (se achica sola)</label><input id="pf" type="file" accept="image/*"><img id="pv" class="prev hide" alt="Vista previa"></div>
      <label><input id="pvis" type="checkbox" checked style="width:auto"> Visible en la tienda</label>
      <div class="row"><button class="btn" id="gp">Guardar producto</button><button class="btn sec" id="cp">Cancelar edición</button></div>
    </section>
    <div id="lista"></div>
  </div>

  <div id="t2" class="tab hide"><section class="box"><h3>Categorías</h3>
    <div class="row"><input id="cn" placeholder="Nueva categoría"><button class="btn" id="gc" style="flex:0">Agregar</button></div><div id="lcat"></div></section></div>

  <div id="t3" class="tab hide"><section class="box"><h3>Datos del negocio</h3>
    <div class="fld"><label>Nombre</label><input id="sn"></div>
    <div class="fld"><label>WhatsApp (solo números, con código de país. Ej: 5492302570810)</label><input id="sw"></div>
    <div class="fld"><label>Usuario de Instagram</label><input id="si"></div>
    <div class="fld"><label>Zona de venta</label><input id="sz"></div>
    <div class="fld"><label>Quiénes somos</label><textarea id="sq" rows="4"></textarea></div>
    <div class="fld"><label>Logo</label><input id="sl" type="file" accept="image/*"><img id="slv" class="prev hide" alt="Logo"></div>
    <button class="btn" id="gs">Guardar negocio</button></section></div>
</div>
</main>
<script type="module" src="js/admin.js"></script>
</body></html>
